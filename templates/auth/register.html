{% extends 'base.html' %}

{% block title %}Register — EduMate{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon auth-logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h2>Create Student Account</h2>
            <p>Start organizing your college studies and exams</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       name="username"
                       id="username"
                       class="form-control"
                       value="{{ username or '' }}"
                       placeholder="e.g. priyanshu"
                       required
                       minlength="3"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="email">College / Personal Email</label>
                <input type="email"
                       name="email"
                       id="email"
                       class="form-control"
                       value="{{ email or '' }}"
                       placeholder="e.g. priyanshu@college.edu"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="At least 6 characters"
                       required
                       minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password"
                       name="confirm_password"
                       id="confirm_password"
                       class="form-control"
                       placeholder="Re-enter your password"
                       required
                       minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
